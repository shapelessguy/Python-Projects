services:
  nginx:
    image: nginx:stable-alpine
    container_name: cyanhouse-nginx
    # Backend (python -m api) runs on this same Ubuntu machine on port 8000;
    # host networking lets nginx reach it at 127.0.0.1:8000 unchanged, and
    # binds 80/443 directly on the host without a `ports:` section.
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/html:/usr/share/nginx/html:ro
      - ./docker/certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    container_name: cyanhouse-certbot
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    # Renewal only — the first certificate must exist before this stack starts
    # (see docker/README.md). Checks twice a day; certbot no-ops until the
    # cert is within its renewal window.
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

  # pyLoad-ng: hoster/debrid downloads, laid out like qBittorrent's: work in
  # progress under /mnt/pangea/temp, finished packages (extracted, if they
  # were archives) moved into /mnt/pangea/downloads beside the torrents —
  # by docker/pyload-overrides/move_to_complete.sh.
  # Its web UI is only published on the
  # loopback — the Media panel's Downloads tab reaches it through the API
  # (api/routers/pyload.py), behind the CyanHouse login; nothing else can.
  pyload:
    image: lscr.io/linuxserver/pyload-ng:latest
    container_name: cyanhouse-pyload
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - ./docker/pyload/config:/config
      # The whole drive, once: in progress (/pangea/temp/pyload) and finished
      # (/pangea/downloads) then share a mount, so the move is a rename, not
      # a copy of every byte to the same disk.
      - /mnt/pangea:/pangea
      - ./docker/pyload-overrides/svc-pyload-run:/etc/s6-overlay/s6-rc.d/svc-pyload/run:ro
      - ./docker/pyload-overrides/move_to_complete.sh:/config/scripts/archive_processed/move_to_complete.sh:ro
