services:
  nginx:
    image: nginx:stable-alpine
    container_name: cyanhouse-nginx
    # Backend (python -m api) runs on this same Ubuntu machine on port 8000;
    # host networking lets nginx reach it at 127.0.0.1:8000 unchanged, and
    # binds 80/443 directly on the host without a `ports:` section.
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/html:/usr/share/nginx/html:ro
      - ./docker/certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    container_name: cyanhouse-certbot
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    # Renewal only — the first certificate must exist before this stack starts
    # (see docker/README.md). Checks twice a day; certbot no-ops until the
    # cert is within its renewal window.
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
